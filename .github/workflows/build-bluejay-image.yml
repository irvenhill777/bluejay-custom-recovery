
name: Build Bluejay TWRP vendor_boot image

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: Build vendor_boot on RunsOn (AWS charges apply)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bluejay-twrp-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.build_image }}
    runs-on: runs-on=${{ github.run_id }}/family=m8i/cpu=16/ram=64/volume=600gb:gp3/image=ubuntu24-full-x64
    timeout-minutes: 360
    env:
      TWRP_MANIFEST_SHA: 814b553116ceedde197f70389cff9661d81d8337
      KERNEL_MANIFEST_SHA: 32530252adf8a4cff0f8520fa29616af6695bd1e
      ANDROID_SOURCE: ${{ runner.temp }}/bluejay-twrp
      KERNEL_SOURCE: ${{ runner.temp }}/bluejay-kernel
      ARTIFACT_DIR: ${{ runner.temp }}/bluejay-artifact

    steps:
      - name: Start RunsOn runner
        uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670

      - name: Check out build configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check runner capacity
        shell: bash
        run: |
          set -euo pipefail
          disk_bytes="$(df -B1 --output=avail "$RUNNER_TEMP" | awk 'NR == 2 { print $1 }')"
          memory_kb="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          cpu_count="$(nproc)"

          if (( disk_bytes < 500000000000 )); then
            disk_gb=$((disk_bytes / 1000000000))
            echo "::error::At least 500 GB free disk is required; runner has ${disk_gb} GB."
            exit 1
          fi
          if (( memory_kb < 62500000 )); then
            echo "::error::At least 64 GB RAM is required; runner has ${memory_kb} kB."
            exit 1
          fi
          if (( cpu_count < 16 )); then
            echo "::error::At least 16 CPU cores are required; runner has ${cpu_count}."
            exit 1
          fi

          df -h "$RUNNER_TEMP"
          free -h
          nproc

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs repo curl ca-certificates

      - name: Sync TWRP Android 16 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ANDROID_SOURCE"
          cd "$ANDROID_SOURCE"
          repo init \
            --depth=1 \
            --manifest-url=https://github.com/TWRP-Test/platform_manifest_twrp_aosp \
            --manifest-branch=twrp-16.0

          manifest_sha="$(git -C .repo/manifests rev-parse HEAD)"
          if [[ "$manifest_sha" != "$TWRP_MANIFEST_SHA" ]]; then
            echo "::error::TWRP manifest changed: expected $TWRP_MANIFEST_SHA, got $manifest_sha."
            exit 1
          fi

          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifests/bluejay.xml" .repo/local_manifests/
          repo sync --current-branch --no-clone-bundle --no-tags -j8

          recovery="$ANDROID_SOURCE/bootable/recovery"
          labs_patch="$GITHUB_WORKSPACE/device/google/bluejay-twrp/patches/gui2-labs.patch"
          git -C "$recovery" apply --check "$labs_patch"
          git -C "$recovery" apply "$labs_patch"

          git -C vendor/google/bluejay lfs pull
          mkdir -p device/google/bluejay-twrp
          cp -a "$GITHUB_WORKSPACE/device/google/bluejay-twrp/." device/google/bluejay-twrp/
          repo manifest -r -o "$ARTIFACT_DIR/twrp-sources.xml"

      - name: Build matching Bluejay kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_SOURCE" "$ARTIFACT_DIR"
          cd "$KERNEL_SOURCE"
          repo init \
            --depth=1 \
            --manifest-url=https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest \
            --manifest-branch=lineage-23.2

          manifest_sha="$(git -C .repo/manifests rev-parse HEAD)"
          if [[ "$manifest_sha" != "$KERNEL_MANIFEST_SHA" ]]; then
            echo "::error::Kernel manifest changed: expected $KERNEL_MANIFEST_SHA, got $manifest_sha."
            exit 1
          fi

          repo sync --current-branch --no-clone-bundle --no-tags -j8
          ./build_bluejay.sh 2>&1 | tee "$ARTIFACT_DIR/kernel-build.log"

          dist="$KERNEL_SOURCE/out/bluejay/dist"
          if [[ ! -s "$dist/boot.img" ]]; then
            echo "::error::Bluejay kernel build did not produce the expected boot.img."
            exit 1
          fi
          cp -a "$dist/." "$ANDROID_SOURCE/device/google/bluejay-kernels/6.1/"

      - name: Build recovery in vendor_boot
        shell: bash
        run: |
          set -eo pipefail
          cd "$ANDROID_SOURCE"
          repo manifest -r -o "$ARTIFACT_DIR/recovery-sources.xml"
          (
            source build/envsetup.sh
            lunch twrp_bluejay-eng
            mka vendorbootimage
          ) 2>&1 | tee "$ARTIFACT_DIR/recovery-build.log"

          image="$ANDROID_SOURCE/out/target/product/bluejay/vendor_boot.img"
          if [[ ! -s "$image" ]]; then
            echo "::error::Build completed without the expected vendor_boot.img."
            exit 1
          fi

          cp "$image" "$ARTIFACT_DIR/vendor_boot.img"
          sha256sum "$ARTIFACT_DIR/vendor_boot.img" > "$ARTIFACT_DIR/SHA256SUMS"
          stat --printf='vendor_boot.img size: %s bytes\n' "$ARTIFACT_DIR/vendor_boot.img" \
            > "$ARTIFACT_DIR/image-info.txt"

      - name: Upload build output and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bluejay-twrp-vendor-boot
          path: ${{ runner.temp }}/bluejay-artifact/
          if-no-files-found: warn
          retention-days: 14
